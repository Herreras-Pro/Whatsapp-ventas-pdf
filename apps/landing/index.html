    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Lazy Tracking Scripts (TikTok & Google) -->
    <script>
      let trackingLoaded = false;
      const loadTrackingScripts = () => {
        if (trackingLoaded) return;
        trackingLoaded = true;
        
        // Google Tag Manager
        const gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=AW-3160406729";
        document.body.appendChild(gtagScript);
        
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'AW-3160406729', { 'allow_enhanced_conversions': true });
      };

      // Load on interaction or after 3.5s timeout
      const userInteractions = ['scroll', 'mousemove', 'touchstart', 'click'];
      userInteractions.forEach(event => {
        window.addEventListener(event, loadTrackingScripts, { once: true, passive: true });
      });
      setTimeout(loadTrackingScripts, 3500);
    </script>
